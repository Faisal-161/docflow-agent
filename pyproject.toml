[project]
name = "docflow-agent"
version = "0.1.0"
description = "Agentic invoice processing: OCR, structured extraction, ERP tool calls, policy checks, human approval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Md Faisal Islam", email = "faisalislam1610@gmail.com" }]
dependencies = [
  "pydantic>=2.6",
  "pypdf>=4.0",
  "pillow>=10.0",
  "pytesseract>=0.3.10",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
ui = ["streamlit>=1.33"]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "reportlab>=4.0"]

[project.scripts]
docflow = "docflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
